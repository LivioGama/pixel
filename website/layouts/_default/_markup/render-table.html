{{- /* Wrap Markdown tables so a wide one scrolls inside the column instead of the page. */ -}}
<div class="table">
<table>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}<th scope="col">{{ .Text }}</th>{{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}<td>{{ .Text }}</td>{{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
