<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  {{ partial "nav.html" . }}

  <main class="docs wrap" id="main">
    <header class="docs__head">
      <h1>{{ .Title }}</h1>
      <p class="docs__lede">{{ .Description }}</p>
    </header>
    <div class="docs__layout">
      <nav class="docs__toc" aria-label="On this page">
        {{ .TableOfContents }}
      </nav>
      <article class="prose">
        {{ .Content }}
      </article>
    </div>
  </main>

  {{ partial "footer.html" . }}

  <script>
    /* Mark the table-of-contents entry for the section being read. */
    (function () {
      var links = [].slice.call(document.querySelectorAll('.docs__toc a[href^="#"]'));
      if (!links.length || !('IntersectionObserver' in window)) return;
      var byId = {};
      links.forEach(function (a) { byId[decodeURIComponent(a.hash.slice(1))] = a; });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          links.forEach(function (a) { a.removeAttribute('aria-current'); });
          var a = byId[e.target.id];
          if (a) a.setAttribute('aria-current', 'location');
        });
      }, { rootMargin: '-15% 0px -75% 0px' });
      Object.keys(byId).forEach(function (id) {
        var h = document.getElementById(id);
        if (h) io.observe(h);
      });
    })();
  </script>
</body>
</html>
