<footer class="footer">
  <div class="wrap footer__inner">
    <a class="brand brand--small" href="{{ "" | relURL }}">
      <span class="brand__pixel" aria-hidden="true"></span>
      <span class="brand__name">pixel</span>
    </a>
    <ul class="footer__links">
      <li><a href="{{ "docs/" | relURL }}">Docs</a></li>
      <li><a href="{{ .Site.Params.github_url }}" rel="noopener">Source on GitHub</a></li>
      <li><a href="{{ "benchmarks/" | relURL }}">Benchmarks</a></li>
      <li><a href="{{ .Site.Params.github_url }}/blob/main/CHANGELOG.md" rel="noopener">Changelog</a></li>
      <li><a href="{{ .Site.Params.github_url }}/blob/main/CONTRIBUTING.md" rel="noopener">Contributing</a></li>
      <li><a href="{{ .Site.Params.github_url }}/blob/main/SECURITY.md" rel="noopener">Security</a></li>
    </ul>
    <p class="footer__license">MIT licensed. Runs on your machine; nothing leaves it.</p>
  </div>
</footer>
<script>
  /* GitHub star count in the nav: shown only once the API answers. */
  (function () {
    var el = document.querySelector('[data-gh-stars]');
    if (!el) return;
    var repo = el.getAttribute('data-gh-stars');
    var key = 'gh-stars:' + repo;
    var show = function (n) {
      if (typeof n !== 'number') return;
      el.textContent = n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
      el.setAttribute('aria-label', n + ' stars');
      el.hidden = false;
    };
    try { show(JSON.parse(sessionStorage.getItem(key))); } catch (_) {}
    fetch('https://api.github.com/repos/' + repo)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        show(d.stargazers_count);
        try { sessionStorage.setItem(key, JSON.stringify(d.stargazers_count)); } catch (_) {}
      })
      .catch(function () {});
  })();

  /* Copy buttons on every command block. The label comes back to what it
     was ("Copy", "Copy all"), and a refused clipboard (no secure context,
     no permission) falls back to selecting the command so a plain Cmd-C works. */
  (function () {
    var write = function (text) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
      return Promise.reject(new Error('no clipboard'));
    };
    document.querySelectorAll('[data-copy]').forEach(function (btn) {
      var label = btn.textContent;
      btn.setAttribute('aria-live', 'polite');
      btn.addEventListener('click', function () {
        var text = btn.getAttribute('data-copy');
        write(text).then(function () {
          btn.textContent = 'Copied';
        }, function () {
          var code = btn.parentNode.querySelector('code');
          if (code && window.getSelection) {
            var range = document.createRange();
            range.selectNodeContents(code);
            var sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
          }
          btn.textContent = 'Select and copy';
        }).then(function () {
          setTimeout(function () { btn.textContent = label; }, 1600);
        });
      });
    });
  })();
</script>
