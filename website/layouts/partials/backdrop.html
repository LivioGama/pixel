<canvas class="backdrop" data-backdrop aria-hidden="true"></canvas>
<script>
  /* The backdrop: three layers on one fixed canvas, each scrolling at its
     own rate for depth. Far: pixel dust that twinkles. Middle: circuit
     traces with packets running along them, the queries. Near: small pixel
     agents drifting, their antennas pulsing, blinking now and then. The
     canvas sits under the page at low opacity (main.css, .backdrop), so it
     never competes with the text. Reduced motion gets one still frame with
     no parallax; a hidden tab draws nothing. */
  (function () {
    var cv = document.querySelector('[data-backdrop]');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var GRID = 24, INK = '#93b3a0', DIM = '#2f7a4f', GREEN = '#22c55e', HI = '#4ade80';
    // Two agents, one row per string: # body, A antenna tip, E eye, M mouth.
    var SPRITES = [
      ['....A....', '....#....', '.#######.', '.#.....#.', '##.E.E.##', '.#.....#.', '.#.MMM.#.', '.#######.'],
      ['..A...A..', '...#.#...', '..#####..', '.##.#.##.', '###E#E###', '#.#####.#', '#.#...#.#', '...##.##.']
    ];
    var seed = 11;
    var rand = function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    var w, h, dpr, span, dust, traces, bots;

    var build = function () {
      dpr = Math.min(2, devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Layer space is one screen and a half tall, so elements wrap out of sight.
      span = h * 1.5;
      seed = 11;
      var cols = Math.ceil(w / GRID), rows = Math.ceil(span / GRID);
      dust = [];
      for (var i = 0, n = Math.round(cols * rows / 9); i < n; i++) {
        dust.push({ x: Math.floor(rand() * cols) * GRID, y: Math.floor(rand() * rows) * GRID, p: rand() * 6.28, s: 0.4 + rand() * 1.2 });
      }
      traces = [];
      for (var t = 0, m = Math.max(5, Math.round(w / 170)); t < m; t++) {
        var x = Math.floor(rand() * cols) * GRID, y = Math.floor(rand() * rows) * GRID;
        var pts = [[x, y]], horiz = rand() < 0.5;
        for (var k = 0; k < 3 + Math.floor(rand() * 3); k++) {
          var len = (3 + Math.floor(rand() * 7)) * GRID * (rand() < 0.5 ? -1 : 1);
          if (horiz) x += len; else y += len;
          pts.push([x, y]);
          horiz = !horiz;
        }
        var total = 0;
        for (var q = 1; q < pts.length; q++) total += Math.abs(pts[q][0] - pts[q - 1][0]) + Math.abs(pts[q][1] - pts[q - 1][1]);
        traces.push({ pts: pts, total: total, at: rand() * total, v: 40 + rand() * 50 });
      }
      bots = [];
      for (var b = 0, nb = Math.max(3, Math.round(w / 300)); b < nb; b++) {
        bots.push({ x: rand() * w, y: rand() * span, v: (6 + rand() * 10) * (rand() < 0.5 ? -1 : 1), px: rand() < 0.4 ? 6 : 5, s: SPRITES[b % 2], blink: rand() * 6, p: rand() * 6.28 });
      }
    };

    // Where a point of a layer lands on screen once the page scrolled by sy.
    var wrapY = function (y, f, sy) { var v = (y - sy * f) % span; return (v < 0 ? v + span : v) - (span - h) / 2; };

    var along = function (tr, d) {
      for (var q = 1; q < tr.pts.length; q++) {
        var a = tr.pts[q - 1], c = tr.pts[q];
        var seg = Math.abs(c[0] - a[0]) + Math.abs(c[1] - a[1]);
        if (d <= seg) { var r = d / seg; return [a[0] + (c[0] - a[0]) * r, a[1] + (c[1] - a[1]) * r]; }
        d -= seg;
      }
      return tr.pts[tr.pts.length - 1];
    };

    var draw = function (time, dt) {
      var sec = time / 1000, sy = still ? 0 : scrollY;
      ctx.clearRect(0, 0, w, h);
      // Far: dust, parallax 0.08.
      ctx.fillStyle = INK;
      dust.forEach(function (d) {
        var y = wrapY(d.y, 0.08, sy);
        if (y < -4 || y > h + 4) return;
        ctx.globalAlpha = 0.25 + 0.35 * Math.max(0, Math.sin(sec * d.s + d.p));
        ctx.fillRect(d.x + 11, y + 11, 2, 2);
      });
      // Middle: traces and their packets, parallax 0.22.
      ctx.lineWidth = 1;
      traces.forEach(function (tr) {
        var off = wrapY(tr.pts[0][1], 0.22, sy) - tr.pts[0][1];
        ctx.globalAlpha = 0.55; ctx.strokeStyle = DIM; ctx.beginPath();
        tr.pts.forEach(function (p, i) { ctx[i ? 'lineTo' : 'moveTo'](p[0] + 0.5, p[1] + off + 0.5); });
        ctx.stroke();
        ctx.fillStyle = DIM;
        [tr.pts[0], tr.pts[tr.pts.length - 1]].forEach(function (p) { ctx.fillRect(p[0] - 3, p[1] + off - 3, 7, 7); });
        tr.at = (tr.at + tr.v * dt) % tr.total;
        var pk = along(tr, tr.at);
        ctx.globalAlpha = 1; ctx.fillStyle = HI;
        ctx.fillRect(Math.round(pk[0]) - 2, Math.round(pk[1] + off) - 2, 5, 5);
      });
      // Near: agents, parallax 0.45.
      bots.forEach(function (b) {
        b.x += b.v * dt;
        var bw = b.s[0].length * b.px;
        if (b.x > w + bw) b.x = -bw; else if (b.x < -bw) b.x = w + bw;
        var y = wrapY(b.y, 0.45, sy) + Math.sin(sec * 0.8 + b.p) * 4;
        if (y < -60 || y > h + 60) return;
        var blinking = (sec + b.blink) % 5 < 0.14;
        b.s.forEach(function (row, r) {
          for (var c = 0; c < row.length; c++) {
            var ch = row[c];
            if (ch === '.') continue;
            if (ch === 'E' && blinking) continue;
            ctx.fillStyle = ch === '#' ? GREEN : HI;
            ctx.globalAlpha = ch === 'A' ? 0.5 + 0.5 * Math.sin(sec * 3 + b.p) : ch === '#' ? 0.75 : 1;
            ctx.fillRect(Math.round(b.x + c * b.px), Math.round(y + r * b.px), b.px - 1, b.px - 1);
          }
        });
      });
      ctx.globalAlpha = 1;
    };

    build();
    var last = 0, raf = 0;
    var loop = function (now) {
      raf = requestAnimationFrame(loop);
      // About 30 frames a second is plenty for drifting pixels.
      if (now - last < 32) return;
      var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;
      draw(now, dt);
    };
    var t;
    addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(function () { build(); if (still) draw(0, 0); }, 150);
    });
    if (still) return draw(0, 0);
    document.addEventListener('visibilitychange', function () {
      cancelAnimationFrame(raf);
      last = 0;
      if (!document.hidden) raf = requestAnimationFrame(loop);
    });
    raf = requestAnimationFrame(loop);
  })();

  /* The nav darkens once the page scrolls under it. */
  (function () {
    var nav = document.querySelector('.nav');
    if (!nav) return;
    var on = false;
    var check = function () {
      var next = scrollY > 8;
      if (next !== on) { on = next; nav.classList.toggle('is-scrolled', on); }
    };
    addEventListener('scroll', check, { passive: true });
    check();
  })();
</script>
