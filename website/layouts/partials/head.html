{{ $desc := .Description | default .Site.Params.description }}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}Pixel: repository answers for coding agents{{ else }}{{ .Title }} | Pixel{{ end }}</title>
<meta name="description" content="{{ $desc }}">
<meta property="og:title" content="{{ if .IsHome }}Pixel{{ else }}{{ .Title }} | Pixel{{ end }}">
<meta property="og:description" content="{{ $desc }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,100,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
{{ $css := resources.Get "css/main.css" }}
{{ if hugo.IsProduction }}{{ $css = $css | minify | fingerprint }}{{ end }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}"{{ if hugo.IsProduction }} integrity="{{ $css.Data.Integrity }}"{{ end }}>
