# The six before/after recordings from the README, in its order. `image` is
# a file in docs/examples/, mounted at /examples/ by hugo.toml.
[[job]]
id = "scope"
name = "Scope before reading"
command = "pixel scope-task"
text = "A closed P0/P1/P2 file list instead of an agent wandering the repository."
image = "pixel-scope-comparison.webp"

[[job]]
id = "measured"
name = "Read skeletons, not files"
command = "pixel list-signatures"
text = "Signatures and budget-fitted context replace whole-file reads, and pixel token-savings reports what that saved."
image = "pixel-measured-comparison.webp"

[[job]]
id = "impact"
name = "Impact before edit"
command = "pixel impact"
text = "Every caller of a symbol, listed before the agent touches it."
image = "pixel-impact-comparison.webp"

[[job]]
id = "rewrite"
name = "Search stays familiar"
command = "pixel search-content"
text = "The hook rewrites rg and grep to the indexed search: same command, indexed answer."
image = "pixel-rewrite-comparison.webp"

[[job]]
id = "rollback"
name = "Rescue as a plan"
command = "pixel plan-rollback"
text = "Flags the likely breaking commit and a last-known-good candidate. It never resets anything."
image = "pixel-rollback-comparison.webp"

[[job]]
id = "publish"
name = "Publish without footguns"
command = "pixel commit-and-push"
text = "Review, then a leased push that is crash-safe and idempotent. Never a raw --force."
image = "pixel-publish-comparison.webp"
