# The "Fair questions" chapter of the landing page, and the FAQPage in its
# JSON-LD: one source, so what an assistant reads in the markup is what a
# visitor reads on the page. `layouts/partials/objections.html` renders it
# for both.
#
# Each `answer` is a list of paragraphs, in HTML. A figure that lives
# elsewhere is never written here: it is a placeholder the partial fills in,
# and an unknown placeholder fails the build.
#
#   {bench}        the /benchmarks/ page (relative on the page, absolute in the JSON-LD)
#   {github}       site.Params.github_url
#   {big.owner}    the token wall's row of data/read_savings.toml: its owner,
#   {big.file}       file name,
#   {big.lines}      line count,
#   {big.full}       tokens of the full read,
#   {big.pixel}      and tokens through Pixel (numbers formatted as on the page)
#   {langs.count}  the code graph's grammars (partials/objections.html, from
#   {langs.list}     crates/pixel-graph/src/extract.rs): their count, their list
#
# The other facts restate SECURITY.md, docs/bench/measured-performance.md
# and content/benchmarks.md: change an answer when they change.

[[objection]]
question = "Will my agent actually use it?"
answer = [
  '''Not every time. Agents are trained on <code>grep</code> and fall back to it. Pixel does not wait for the agent to discover a tool: <code>pixel install</code> puts its protocol into every session, and <code>pixel install --repo</code> adds a guard that flags untargeted reads of large files. The guard advises and never blocks.''',
  '''With Pixel 0.5.0 it did: in each of the 11 recorded runs behind the demo, the agent called Pixel 6 to 17 times. An earlier release fared worse: given its protocol alone, the agent barely ran a Pixel command, yet still scoped tasks 29% faster, so part of the gain is the protocol's guidance itself. <a class="link" href="{bench}#on-whole-agent-tasks" target="_blank" rel="noopener">The runs</a>''',
]

[[objection]]
question = "Why not just grep?"
answer = [
  '''Grep finds the line. The cost is what comes next: the agent opens the whole file to understand the match. On {big.owner} {big.lines}-line {big.file} that read costs {big.full} tokens, and Pixel's answer to the same question {big.pixel}. <code>pixel search-content</code> keeps grep's regex syntax, so the agent changes nothing but the bill.''',
]

[[objection]]
question = "Why not a language server?"
answer = [
  '''A language server resolves types, so its "who calls this" is more exact than a syntax graph's. It also needs one running server per language and answers one cursor position at a time. Pixel is one binary, covers {langs.count} languages and your Git history, and says when an answer may be incomplete: static analysis never sees every dynamic call, and every graph answer carries that warning.''',
]

[[objection]]
question = "Why not my editor's index?"
answer = [
  '''It lives inside that editor. Pixel runs from the shell, so every agent on this page gets the same index, and it stays in <code>.pixel/</code> at your repository root.''',
]

[[objection]]
question = "Pixel or semble?"
answer = [
  '''Both, if you search in plain English a lot. semble puts the right file in its top 10 for 100% of 45 natural-language queries, Pixel for 69%. Pixel adds the call graph, blast radius, Git history and guarded Git writes. Together they cost about 5,100 tokens of context per turn. <a class="link" href="{bench}#where-a-specialist-wins" target="_blank" rel="noopener">Where a specialist wins</a>''',
]

[[objection]]
question = "Does anything leave my machine?"
answer = [
  '''Nothing you did not ask for. The index lives in <code>.pixel/</code> and there is no telemetry. Pixel touches the network for four things only: the embedding model it downloads from Hugging Face on first use, the Git remote operations you run (<code>pixel fetch</code>, <code>pixel push</code>), <code>pixel classify</code>, which sends its question to the model you configure, and <code>pixel web-search</code>, which sends its query to the SearXNG endpoint you configure and nowhere else, or, without one, to DuckDuckGo and then Wikipedia. <a class="link" href="{github}/blob/main/SECURITY.md" target="_blank" rel="noopener">Security model</a>''',
]

[[objection]]
question = "Which languages?"
answer = [
  '''Text search covers every file Git does not ignore, up to 4 MiB. The code graph covers {langs.list}. The last five go through a generic extractor rather than a dedicated one.''',
]
