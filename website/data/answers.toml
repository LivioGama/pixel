# The /answers/ pages: one question a developer asks about coding agents,
# answered from Pixel's own measurements. Each entry is the data of
# content/answers/<slug>.md (YAML front matter `answer: "<slug>"`, the question
# as its `title`, the detail as its prose), read through
# layouts/partials/answers.html by the page, the /answers/ index and their
# JSON-LD, so the markup never says what the page does not.
#
# A question gets a page only when /benchmarks/ carries its figure. The
# partial fails the build when:
#   - a `bench` anchor is not a heading of content/benchmarks.md;
#   - a number in `short`, `limits`, a row, or the page's own prose is not
#     written in one of the `bench` sections it names (a figure that lives
#     in data/read_savings.toml is a placeholder instead, listed below);
#   - `limits` is empty: every page says where Pixel does not win;
#   - a `related` path is not a page of the site;
#   - an entry has no page, or a page no entry.
# crates/pixel/tests/cli/docs_drift.rs reads this file and the pages, so
# every <code>pixel …</code> must be a real command, and static/llms.txt
# must link every page under its question.
#
# Per entry:
#   slug       the page's path (/answers/<slug>/)
#   gist       one line after the question on the index and in llms.txt
#   short      the answer in two or three sentences, HTML: the page's lede
#              and the JSON-LD's acceptedAnswer
#   bench      the /benchmarks/ sections (anchors) the figures come from
#   limits     where Pixel does not win or the figure stops, HTML
#   related    site paths ("vs/grep/", "for/claude-code/", "savings/")
#   checked    the day the figures were last checked against /benchmarks/;
#              the page's "Updated" date is the later of it and its Git date
#   [[answer.row]]  label, value: the figure table, HTML
#
# Placeholders (partials/figures.html, shared with data/alternatives.toml):
#   {bench} {kept.range} {kept.count} {kept.median}
#   {big.owner} {big.file} {big.lines} {big.full} {big.pixel}

[[answer]]
slug = "why-agents-read-whole-files"
gist = "its read tool returns files, not answers; an index answers what a file contains in a fraction of the tokens."
short = '''Because its read tool returns files, not answers: to learn what a file contains, the agent opens all of it. On {big.owner} {big.lines}-line {big.file} the whole file is {big.full} estimated tokens versus {big.pixel} for <code>pixel list-signatures</code> (UTF-8 bytes divided by four, Pixel 0.5.0). Across {kept.count} well-known files the agent reads {kept.range} less, median {kept.median}.'''
bench = ["well-known-files", "reading-code"]
limits = '''The figure counts what reaches the agent's context, not your invoice. The files with the most signatures per line save the least, the low end of the range: VS Code's text model and CPython's <code>typing.py</code>. A file the graph cannot parse lists too few signatures and overstates the saving, which is why React's work loop, written in Flow, is left out of the range. When the agent edits, it still reads the lines it changes.'''
related = ["vs/grep/", "vs/shunt/", "savings/"]
checked = 2026-09-30

  [[answer.row]]
  label = "Full read of {big.file}"
  value = "{big.full}&nbsp;tok"

  [[answer.row]]
  label = "<code>pixel list-signatures</code> on it"
  value = "{big.pixel}&nbsp;tok"

  [[answer.row]]
  label = "Less read, {kept.count} well-known files"
  value = "{kept.range}, median {kept.median}"

  [[answer.row]]
  label = "Pixel's own repository, single large file"
  value = "48,465&nbsp;tok read in full, 2,172&nbsp;tok through Pixel"

[[answer]]
slug = "mcp-or-cli-context-cost"
gist = "an MCP server costs its tool schemas on every turn, a CLI the prompt that teaches it; the size decides, not the protocol."
short = '''An MCP server puts its tool schemas into the context of every turn; a CLI puts in the prompt that teaches the agent its commands. Measured on one machine, GitNexus's MCP tools cost about 19,700 tokens per turn and Pixel's CLI prompt about 4,160, 4.7× less. The protocol is not the lever, the size is: semble's and stacklit's MCP servers cost less than Pixel's prompt.'''
bench = ["against-gitnexus", "where-a-specialist-wins"]
limits = '''Pixel is the lighter one only against GitNexus: semble costs about 980 tokens per turn and stacklit about 420, both less than Pixel. None of these figures counts what an answer costs once the agent asks. A user can switch off individual MCP tools, which shrinks a server's share.'''
related = ["vs/gitnexus/", "vs/semble/"]
checked = 2026-09-25

  [[answer.row]]
  label = "GitNexus, MCP tool schemas and its <code>CLAUDE.md</code> block"
  value = "~19,700&nbsp;tok"

  [[answer.row]]
  label = "Pixel, the agent prompt of its CLI"
  value = "~4,160&nbsp;tok"

  [[answer.row]]
  label = "semble, MCP"
  value = "~980&nbsp;tok"

  [[answer.row]]
  label = "stacklit, MCP"
  value = "~420&nbsp;tok"

  [[answer.row]]
  label = "semble and Pixel together"
  value = "~5,100&nbsp;tok"

[[answer]]
slug = "reduce-claude-code-tokens"
gist = "compare whole-file reads with signatures; read-volume estimates do not establish session cost savings."
short = '''Ask for an outline before reading a whole file. On {kept.count} pinned large files with Pixel 0.5.0, signatures were {kept.range} smaller than full reads, median {kept.median}, with tokens estimated from UTF-8 bytes divided by four. This does not measure total session tokens or billed cost.'''
bench = ["well-known-files", "on-whole-agent-tasks"]
limits = '''Edits still need code bodies. The newer Opus medium trial with hooks found no speed gain on its scoping task; raw runs are outside the repository. The archived Sonnet demo used an appended prompt without hooks and included reads of its own traces. Neither validates current-install token or cost savings.'''
related = ["for/claude-code/", "savings/", "vs/shunt/"]
checked = 2026-09-30

  [[answer.row]]
  label = "File versus signatures, estimated tokens"
  value = "{kept.range} less, median {kept.median}"

  [[answer.row]]
  label = "Newer Opus medium trial, median duration"
  value = "42.9 s without Pixel, 47.6 s with hooks"

[[answer]]
slug = "grep-or-code-index"
gist = "grep finds the line; the whole-file read after it is the cost an index removes."
short = '''Both, for different steps. Grep finds the line with nothing to build; the cost is the whole-file read that follows, which an index replaces with the file's signatures: {big.full} estimated tokens against {big.pixel} on {big.owner} {big.file} (UTF-8 bytes divided by four, Pixel 0.5.0). For "who calls this", grep's matches are the ground truth our blast-radius benchmark scores against, and it returns every line that names the function, callers or not.'''
bench = ["well-known-files", "against-gitnexus", "on-whole-agent-tasks"]
limits = '''Grep needs no index and runs on any file the moment it exists; Pixel builds one in <code>.pixel/</code> first. On a single lookup the August runs found Pixel about 1.5 seconds slower. Pixel's graph misses callers grep sees: 0.86 of them overall, 0.56 on one Ruby repository. For a question in plain English, neither is the best tool: semble is.'''
related = ["vs/grep/", "vs/semble/", "vs/language-server/"]
checked = 2026-09-30

  [[answer.row]]
  label = "Finds the matching line"
  value = "Both; <code>pixel search-content</code> keeps grep's regex syntax"

  [[answer.row]]
  label = "What the agent reads to know what {big.file} contains"
  value = "{big.full}&nbsp;tok after grep, {big.pixel}&nbsp;tok through Pixel"

  [[answer.row]]
  label = "Less read, {kept.count} well-known files"
  value = "{kept.range}"

  [[answer.row]]
  label = "Callers found, 29 blast-radius cases scored against grep"
  value = "0.86 recall"

[[answer]]
slug = "will-my-agent-use-the-tool"
gist = "the archived prompt-only demo called Pixel in 11 runs out of 11; current-hook adoption is not quantified here."
short = '''Only if the tool is in front of it every session: agents are trained on grep and fall back to it. In the archived Pixel 0.5.0 demo with its prompt appended without hooks, Claude Code called Pixel in 11 runs out of 11, 6 to 17 times each. An earlier release, given its protocol alone with no hooks, was barely called at all.'''
bench = ["on-whole-agent-tasks"]
limits = '''An archived prompt-only demo on one task, including reads of its own traces: adoption with current hooks or another agent is not measured. The per-repository guard advises and never blocks, so an agent can still read a whole file. Part of the gain is the protocol's guidance rather than its answers: the earlier release that was barely called still scoped tasks 29% faster.'''
related = ["for/", "for/claude-code/"]
checked = 2026-09-30

  [[answer.row]]
  label = "Runs in which the agent called Pixel"
  value = "11 of 11"

  [[answer.row]]
  label = "Pixel calls per run"
  value = "6 to 17"

  [[answer.row]]
  label = "Earlier release, protocol only, no hooks"
  value = "Barely called; tasks still scoped 29% faster"

[[answer]]
slug = "what-will-a-change-break"
gist = "ask for the blast radius first: pixel impact found 0.86 of the callers on 29 cases, with a warning when an answer may be incomplete."
short = '''Ask for the blast radius before the edit: <code>pixel impact</code> lists the callers upstream of a symbol from a code graph, and <code>pixel who-calls</code> the direct ones. On 29 blast-radius cases in Rust, TypeScript and Ruby, Pixel found 0.86 of the callers grep confirms, in a 153 ms median. Static analysis never sees every dynamic call, so every graph answer says when it may be incomplete.'''
bench = ["against-gitnexus"]
limits = '''The figure is callers found, not breakage predicted: a caller is where to look, not proof that it breaks. Ruby is the weak spot, 0.90 and 0.56 on two repositories where GitNexus finds 1.00 and 0.68. A language server resolves types, so its references are more exact for the language it serves; this page has no figure for it.'''
related = ["vs/gitnexus/", "vs/language-server/"]
checked = 2026-09-25

  [[answer.row]]
  label = "Callers found, 29 cases"
  value = "0.86 (GitNexus 0.84, a tie at this sample size)"

  [[answer.row]]
  label = "Callers found in Rust and TypeScript"
  value = "Every one"

  [[answer.row]]
  label = "Callers found in Ruby, two repositories"
  value = "0.90 and 0.56"

  [[answer.row]]
  label = "Median time per answer"
  value = "153&nbsp;ms"
