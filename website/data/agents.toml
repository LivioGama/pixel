# The coding agents the site names, in the order the home shows them: the
# hero's four marks and count, the Compatibility grid, the /for/<slug>/
# pages, and the "What pixel install wires" table of /docs/
# (layouts/shortcodes/agents.html). One entry per agent; its mark is
# assets/logos/<logo>.svg.
#
# Every fact here restates crates/pixel-install, the plugin manifests at the
# repository root or the rule files under .cursor/ and .windsurf/. A pull
# request that changes what `pixel install` writes changes this file too:
# crates/pixel/tests/cli/docs_drift.rs runs a real `pixel install` and
# `pixel install --repo` into empty directories and fails when the files
# they write differ from the `global`, `shared` and `repo` lists below, when
# a `checks` id is not a `pixel doctor` check, or when an agent check of
# `pixel doctor` belongs to no agent.
#
#   wiring  how Pixel reaches the agent:
#             install  `pixel install` writes the agent's own config
#             plugin   the agent's plugin or extension mechanism loads it;
#                      `pixel install` writes nothing for it
#             rules    a rules file the repository ships, copied into the
#                      project by hand
#   global  files `pixel install` writes for this agent, from the home
#           directory (`~/`); a trailing `/` is a directory Pixel owns
#   when    the condition `pixel install` checks before writing them
#   wires   one Markdown line: what those files do (the /docs/ table)
#   note    Markdown: one more paragraph under "What pixel install writes"
#   repo    files `pixel install --repo` writes for it, from the repository
#   repo_note  Markdown: one more paragraph under "Per repository"
#   plugin  Markdown: the plugin command, when the agent has one
#   rules   the rules file to copy, from the repository root
#   checks  the `pixel doctor` check ids that judge this agent's wiring
#   lede    Markdown: the /for/<slug>/ page's opening line
#
# Text fields are Markdown rendered inline; a `pixel <command>` in them must
# exist (docs_drift.rs reads this file).

# Written by every `pixel install`, whichever agents are present: the agent
# prompt Claude Code's SessionStart hook injects, and the short prompt for
# its sub-agents.
shared = ["~/.local/share/pixel/agent-prompt.md", "~/.local/share/pixel/subagent-prompt.md"]

[[agent]]
slug = "claude-code"
name = "Claude Code"
logo = "claude"
wiring = "install"
lede = "`pixel install` adds lifecycle hooks to Claude Code's user settings, so every session starts with Pixel's protocol, and `pixel install --repo` adds an advisory guard to one repository."
global = ["~/.claude/settings.json"]
wires = "`SessionStart` and `UserPromptSubmit` hooks in `~/.claude/settings.json` inject the prompt as context, plus a `PostToolUse` hook on `Edit` and a `SessionStart` hook on `compact`. No shell wrapper, never blocks."
repo = [".claude/settings.local.json", ".claude/pixel-rtk-hooks.json"]
plugin = "`/plugin marketplace add LivioGama/pixel`, then `/plugin install pixel@pixel`: its `SessionStart` and `SubagentStart` hooks inject the protocol instead"
checks = ["install.claude-hooks", "repo.claude-hooks"]

[[agent]]
slug = "codex"
name = "Codex"
logo = "codex"
wiring = "install"
lede = "`pixel install` puts Pixel's protocol into the one key of Codex's config that every Codex front end reads, and `pixel install --repo` adds a project guard."
global = ["~/.codex/config.toml", "~/.codex/hooks.json"]
when = "in `$CODEX_HOME` instead of `~/.codex` when that variable is set"
wires = "the `developer_instructions` key of `~/.codex/config.toml`, which every Codex front end reads, plus a metrics `PostToolUse` hook"
repo = [".codex/config.toml", ".codex/hooks.json", ".codex/pixel-composed-guard-backup.json"]
repo_note = "Codex has no personal project file, so the guard is left out when Git tracks `.codex/hooks.json`: it would carry this machine's path into every clone."
plugin = "`codex plugin marketplace add LivioGama/pixel`, then `codex plugin add pixel@pixel`"
checks = ["install.codex-config", "install.codex-metrics-hook", "repo.codex-config", "repo.codex-hooks"]

[[agent]]
slug = "pi"
name = "Pi"
logo = "pi"
wiring = "install"
lede = "`pixel install` writes Pixel's protocol into the system-prompt file Pi reads on its own, and `pixel install --repo` adds a guard extension to one repository."
global = ["~/.pi/agent/APPEND_SYSTEM.md"]
wires = "`~/.pi/agent/APPEND_SYSTEM.md`, read automatically"
repo = [".pi/extensions/pixel-guard.ts"]
repo_note = "Pi loads the extension once it trusts the project."
plugin = "`pi install git:github.com/LivioGama/pixel`"
checks = ["install.pi-prompt", "repo.pi-guard"]

[[agent]]
slug = "cursor"
name = "Cursor"
logo = "cursor"
wiring = "rules"
lede = "`pixel install` does not touch Cursor. The repository ships a Cursor rule that always applies: copy it into your project."
rules = ".cursor/rules/pixel.mdc"

[[agent]]
slug = "copilot-cli"
name = "Copilot CLI"
logo = "copilot"
wiring = "plugin"
lede = "`pixel install` does not touch Copilot CLI. Pixel reaches it as a plugin, from the same manifest as Claude Code's (`.claude-plugin/plugin.json`)."
plugin = "`copilot plugin marketplace add LivioGama/pixel`, then `copilot plugin install pixel@pixel`"

[[agent]]
slug = "gemini-cli"
name = "Gemini CLI"
logo = "gemini"
wiring = "plugin"
lede = "`pixel install` does not touch Gemini CLI. Pixel reaches it as an extension whose context file is the protocol, `PIXEL.md`."
plugin = "`gemini extensions install https://github.com/LivioGama/pixel`"
note = "Antigravity also keeps its configuration under `~/.gemini/`, in `~/.gemini/config/`, but it is another agent, and `pixel install` wires it."

[[agent]]
slug = "opencode"
name = "OpenCode"
logo = "opencode"
wiring = "install"
lede = "`pixel install` puts Pixel's protocol into OpenCode's global `AGENTS.md`, the one instruction file both OpenCode generations load."
global = ["~/.config/opencode/AGENTS.md"]
when = "only when OpenCode's config directory exists: `$XDG_CONFIG_HOME/opencode`, else `~/.config/opencode`"
wires = "the prompt appended to `AGENTS.md`"
note = "Your own instructions in that `AGENTS.md` stay: Pixel owns only the block between its `pixel:managed` markers. When the file does not exist yet and `~/.claude/CLAUDE.md` does, the new file starts with that content, since on OpenCode's first generation a global `AGENTS.md` takes the place of the `CLAUDE.md` fallback."
checks = ["install.opencode-agents-md"]

[[agent]]
slug = "devin"
name = "Devin"
logo = "devin"
wiring = "plugin"
lede = "`pixel install` writes nothing global for Devin: the protocol comes from Pixel's Devin plugin, and `pixel install --repo` adds a guard to one repository."
repo = [".devin/config.local.json"]
plugin = "add `github.com/LivioGama/pixel` as a Devin plugin"
checks = ["repo.devin-hooks"]

[[agent]]
slug = "windsurf"
name = "Windsurf"
logo = "windsurf"
wiring = "rules"
lede = "`pixel install` does not touch Windsurf. The repository ships a Windsurf rule: copy it into your project."
rules = ".windsurf/rules/pixel.md"

[[agent]]
slug = "antigravity"
name = "Antigravity"
logo = "antigravity"
wiring = "install"
lede = "`pixel install` deploys a Pixel plugin into Antigravity's config, enables it, and registers its guard hooks."
global = ["~/.gemini/config/plugins/pixel/", "~/.gemini/config/config.json", "~/.gemini/config/hooks.json"]
when = "only when Antigravity's config directory, `~/.gemini/config`, exists"
wires = "the Pixel plugin deployed and enabled, and its guard hooks registered"
note = "The plugin carries the prompt twice, as a rule and as a skill (`rules/AGENTS.md`, `skills/pixel/SKILL.md`). `config.json` enables it, and `hooks.json` runs Pixel's guard before Antigravity's `run_command`, `grep_search`, `find_by_name` and `view_file` calls, in every workspace."
checks = ["install.antigravity"]
