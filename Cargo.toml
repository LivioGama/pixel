[workspace]
resolver = "3"
members = ["crates/pixel-index", "crates/pixel", "crates/pixel-graph", "crates/pixel-context", "crates/pixel-daemon", "crates/pixel-recall", "crates/pixel-bench", "crates/pixel-session", "crates/pixel-proto", "crates/pixel-git", "crates/pixel-rank", "crates/pixel-ops", "crates/pixel-facts", "crates/pixel-install", "crates/pixel-actionlog", "crates/pixel-flow"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LivioGama/pixel"
rust-version = "1.85"

[workspace.dependencies]
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1.6"
criterion = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# Vendored OpenSSL: lets musl static builds compile without a system
# OpenSSL. Pulled in transitively via fastembed → hf-hub → native-tls.
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Keep macOS release binaries runnable with the current toolchain.
strip = "none"

# Local iteration profile for `pixel upgrade`: same optimisation level as
# release, minus the two settings that dominate an incremental rebuild
# (thin LTO and a single codegen unit). Measured on an 8-core M-series,
# touching only the CLI crate: 55 s under `release`, 9 s here. Shipped
# binaries keep using `release`.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
