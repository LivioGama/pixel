name: CI

on:
  push:
    # develop is the integration branch (feature PRs are routed there);
    # main only receives release/hotfix merges. Both must stay green.
    branches: [main, develop]
  pull_request:

# A new push to a pull request cancels the run still in flight for its
# previous commit. Branch pushes (main, develop) are never cancelled so every
# merge commit keeps a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the checkout; it never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One key for every job that builds the debug profile on Linux
          # (this one and mutants.yml), instead of the default per-job key.
          # The Mutants workflow only runs on pull_request, so it can never
          # save under the develop/main rule below: without a shared key it
          # started from an empty cache on every PR.
          shared-key: linux-debug
          # PRs read the cache but never write it: only develop/main
          # merges refresh the shared entries, so one PR cannot thrash
          # or poison them. A failed build still saves what it compiled.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Prebuilt binary; the profile lives in .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-nextest

      # --locked: fail if Cargo.lock is out of date instead of silently
      # resolving newer dependency versions than the ones committed.
      # nextest runs one process per test, retries once and still fails the
      # run on a flaky result, and kills a test that hangs past 3 minutes.
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --locked --doc

      - name: Installer contracts (isolated release substitutes)
        run: python3 scripts/test-install.py

      - name: Local gate runner contract (stub cargo, disposable repo)
        run: python3 scripts/test-gates.py

      - name: Warnings-denied Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Supported CLI feature lanes
        run: |
          cargo check -p pixel-cli --no-default-features
          cargo check -p pixel-cli --no-default-features --features model2vec

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install TypeScript integration dependencies
        working-directory: js/sniper
        run: bun install --frozen-lockfile

      # The test helper builds and identifies this checkout's native binary
      # before sending real Vite and golden-envelope payloads across the CLI.
      - name: TypeScript integration and types
        working-directory: js/sniper
        run: |
          bun run test
          bun run typecheck

  cross-build:
    name: Cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          targets: ${{ matrix.target }}

      # Keyed by target so the two musl caches do not overwrite each other.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PRs read the cache but never write it: only develop/main
          # merges refresh the shared entries, so one PR cannot thrash
          # or poison them. A failed build still saves what it compiled.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          key: ${{ matrix.target }}

      # Prebuilt binary instead of `cargo install cross` (~40 s per run).
      # cross compiles inside its own Docker image, which carries the musl
      # toolchain, so no host musl-tools/perl/make are needed.
      - name: Install cross
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cross

      # Must match release.yml exactly: fastembed (ONNX) has no musl build,
      # but model2vec is pure Rust and ships in the Linux release. Building
      # without it here would leave the released feature set untested.
      - name: Cross-build (model2vec only — ort-sys has no musl prebuilts)
        run: cross build --release --locked --no-default-features --features model2vec --target ${{ matrix.target }} -p pixel-cli
