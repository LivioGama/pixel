name: CI

on:
  push:
    # main is the only long-lived branch: every pull request merges into it
    # and every release is a tag on it.
    branches: [main]
  pull_request:
    # A pull request that only touches documentation no test reads -- prose
    # under docs/, the licence files, a Markdown file outside the list below
    # -- cannot change a test result, so it skips the two-and-a-half-minute
    # run; the Hugo site under website/ has its own workflow, pages.yml
    # (which stays in: scripts/verify-action-pins.py reads every workflow).
    # Later patterns win: the negations drop the docs first, then the
    # re-includes put back what the suite actually reads:
    #   - crates/**: the bundled agent prompts, checked by the install tests;
    #   - the files crates/pixel/tests/cli/docs_drift.rs reads: it asserts
    #     that every `pixel <command>` quoted there exists, that the README
    #     and CHANGELOG rename tables match RENAMED_COMMANDS row for row, and
    #     that the rule ids of the rust-guidelines skill head real guideline
    #     sections;
    #   - changelog.d/**: the fragments scripts/test-prepare.py validates
    #     against the release script's contract, in the repository itself and
    #     not only in its fixtures;
    #   - the generated plugin surfaces, which install_tests.rs compares
    #     against the prompts (scripts/gen-plugin-assets.sh --check),
    #     .agents/skills/pixel/ among them;
    #   - .agents/skills/release/: prepare.sh, which scripts/test-prepare.py
    #     and pixel-release's tests run or read;
    #   - .agents/skills/pixel-retro/: lead_time.py and its contract test.
    # Every other skill is excluded: no test reads it.
    # Add a path here when a test starts reading one. Pushes to main stay
    # unfiltered so every merge there keeps a complete run. No branch
    # rule requires this check today; if one is added, the excluded paths
    # need a twin workflow that reports success.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!website/**"
      - "!LICENSE"
      - "!NOTICE"
      # A skill no test reads is documentation too; the skills the suite
      # does read are put back below.
      - "!.agents/skills/**"
      - "crates/**"
      # docs_drift.rs:
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "changelog.d/**"
      - "docs/manual-setup.md"
      - "website/content/docs.md"
      - "website/content/benchmarks.md"
      - ".agents/rules/**"
      - ".agents/skills/rust-guidelines/**"
      # scripts/test-prepare.py and pixel-release's tests read prepare.sh:
      - ".agents/skills/release/**"
      # test_lead_time.py:
      - ".agents/skills/pixel-retro/**"
      - "scripts/README.md"
      # gen-plugin-assets.sh --check:
      - "PIXEL.md"
      - "PIXEL-SUBAGENT.md"
      - "skills/**"
      - ".agents/skills/pixel/**"
      - ".openclaw/**"
      - ".clinerules/**"
      - ".kiro/**"
      - ".qoder/**"
      - ".windsurf/**"

# A release-prepare pull request into main (`release-x.y.z` branch whose
# diff the `scope` job verifies) skips every job, as it skips Cross-build:
# its diff is version bumps, Cargo.lock
# and the changelog, `prepare.sh` already ran `check-release` and the gates
# on it, and the release skill tags only once the push run on the merge
# commit is green, so the pull request run would test the same tree twice.
# A maintenance release into `release/x.y` keeps them: no push run covers
# that branch.
#
# A new push to a pull request cancels the run still in flight for its
# previous commit. A push to main gets a group of its own commit: with one
# group per ref, GitHub keeps one run in progress and one pending, and each
# new merge cancelled the pending one (#310's merge lost its run that way)
# and waited behind the one in progress, a website merge included. Every
# merge now keeps a complete run, started at once, which is what the
# release skill waits on before it tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the checkout; it never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release-prepare pull request? See release-prepare-scope.yml.
  scope:
    uses: ./.github/workflows/release-prepare-scope.yml

  # Which files a pull request touched, so a commit that cannot affect a
  # step does not pay for it. `cargo` covers the compiled suite AND every
  # file its tests read (the docs-drift, install and plugin-surface inputs
  # re-included in the paths filter above); `scripts` covers the Python
  # and Bun contract tests' inputs; `deps` covers the graph cargo-deny
  # resolves. A push to main reports all three so every merge keeps the
  # complete run the concurrency comment promises. Both lists err toward
  # inclusion: a false negative skips a needed check, a false positive
  # only costs a minute.
  changes:
    outputs:
      cargo: ${{ steps.diff.outputs.cargo }}
      scripts: ${{ steps.diff.outputs.scripts }}
      deps: ${{ steps.diff.outputs.deps }}
    runs-on: ubuntu-26.04
    steps:
      # Full history so the merge base with the target branch is available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'cargo=true\nscripts=true\ndeps=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt

          # Everything that compiles Rust or that a compiled test asserts
          # on: crates, the workspace manifest and cargo config, the files
          # docs_drift.rs compares command-for-command, the plugin surfaces
          # install_tests.rs regenerates, and the scripts those tests run.
          # This workflow too: a pull request that only edits how the Rust
          # steps build (a profile variable, a cache key, a nextest flag)
          # otherwise skips them and reports green having run none (#371).
          cat > cargo.re <<'EOF'
          ^crates/
          ^Cargo\.(toml|lock)$
          ^\.cargo/
          ^\.config/
          ^deny\.toml$
          ^rust-toolchain
          ^(README|ARCHITECTURE|CONTRIBUTING|AGENTS|CHANGELOG|PIXEL|PIXEL-SUBAGENT)\.md$
          ^docs/manual-setup\.md$
          ^website/
          ^\.agents/(rules|skills/(rust-guidelines|release|pixel))/
          ^skills/
          ^\.(openclaw|clinerules|kiro|qoder|windsurf)/
          ^scripts/gen-plugin-assets\.sh$
          ^\.github/workflows/ci\.yml$
          EOF

          # The contract tests' own inputs: their scripts, the fixtures and
          # shells they exercise, the workflows verify-action-pins parses,
          # the fragments test-prepare validates, prepare.sh under the
          # release skill, and the pi extension test-pi-policy.mjs imports.
          cat > scripts.re <<'EOF'
          ^scripts/
          ^\.githooks/
          ^changelog\.d/
          ^\.github/workflows/
          ^\.agents/skills/release/
          ^\.agents/skills/pixel-retro/
          ^\.cargo/mutants\.toml$
          (^|/)Cargo\.toml$
          ^crates/pixel-install/assets/pi-pixel\.ts$
          EOF

          # Only the dependency graph feeds cargo-deny.
          cat > deps.re <<'EOF'
          (^|/)Cargo\.toml$
          ^Cargo\.lock$
          ^deny\.toml$
          EOF

          flag() { grep -Eqf "$1" changed.txt && echo true || echo false; }
          {
            echo "cargo=$(flag cargo.re)"
            echo "scripts=$(flag scripts.re)"
            echo "deps=$(flag deps.re)"
          } >> "$GITHUB_OUTPUT"
          cat changed.txt

  test:
    name: Test + Format
    needs: [scope, changes]
    if: needs.scope.outputs.release-prepare != 'true'
    # GitHub's image by default. PIXEL_RUNNER_LABELS moves the jobs that compile
    # Rust to a self-hosted runner without a second edit: set it to a JSON array of
    # labels, e.g. ["self-hosted","linux","arm64","pixel-local"], and a push or a
    # manual run goes there; delete the variable and it goes back to GitHub. Pull
    # requests never do: their code is not reviewed yet, and a persistent host is
    # not isolated by `contents: read` and `persist-credentials: false`. Declared
    # only when the variable is set, so a stopped runner cannot leave the job
    # queueing forever.
    runs-on: ${{ github.event_name != 'pull_request' && vars.PIXEL_RUNNER_LABELS && fromJSON(vars.PIXEL_RUNNER_LABELS) || 'ubuntu-26.04' }}
    # Line tables instead of full debug info for the dev and test profiles:
    # a failing test's backtrace keeps its file:line, and the compiler and
    # linker skip the type and variable info no one reads in CI (the build
    # was 58 s of the Test step and the cache 1 524 MB, restored in 27 s, on
    # main run 36584496012). Job-level, not step-level: rust-cache hashes
    # the job's CARGO_* variables into its key, and every Mutants shard
    # restores this job's `linux-debug` entry, so mutants.yml sets the same
    # value the same way; the two drifting apart would give the shards a
    # key the Test job never writes. Local builds keep full debug info.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      # First, before anything is installed: a floating tag in release.yml
      # would run unreviewed code next to the tap token and the signing
      # identity. Contract in scripts/test-verify-action-pins.py below.
      - name: Action pins (every uses on a full commit SHA)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/verify-action-pins.py

      - name: Install Rust toolchain
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          components: rustfmt

      - name: Cache Rust build
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One key for every job that builds the debug profile on Linux
          # (this one and mutants.yml), instead of the default per-job key.
          # The Mutants workflow only runs on pull_request, so it can never
          # save under the main rule below: without a shared key it
          # started from an empty cache on every PR.
          shared-key: linux-debug
          # PRs read the cache but never write it: only merges into main
          # refresh the shared entries, so one PR cannot thrash
          # or poison them. A failed build still saves what it compiled.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        # Vendored OpenSSL needs perl and make. The GitHub Ubuntu images ship
        # both ("already the newest version" in every log), so the ~7 s of
        # apt-get update runs only on an image that lacks one of them.
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      - name: Check formatting
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        run: cargo fmt --all -- --check

      # Prebuilt binary; the profile lives in .config/nextest.toml.
      - name: Install cargo-nextest
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-nextest

      # --locked: fail if Cargo.lock is out of date instead of silently
      # resolving newer dependency versions than the ones committed.
      # nextest runs one process per test, retries once and still fails the
      # run on a flaky result, and kills a test that hangs past 3 minutes.
      - name: Test
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        run: cargo nextest run --workspace --locked --profile ci

      # nextest does not run doctests.
      - name: Doctests
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        run: cargo test --workspace --locked --doc

      # Nothing runs pixel in this checkout before the tests, so any action
      # log here was written by a test that spawned the binary from its own
      # working directory (`crates/<crate>`) instead of a fixture. The CLI
      # suite's `support::pixel_command()` starts every run elsewhere.
      - name: Tests left the checkout's action log alone
        if: ${{ needs.changes.outputs.cargo == 'true' }}
        run: |
          if [ -e .pixel/actions.jsonl ]; then
            echo "::error::the test suite wrote $(wc -l < .pixel/actions.jsonl) entries into this checkout's .pixel/actions.jsonl"
            cat .pixel/actions.jsonl
            exit 1
          fi

      - name: Installer contracts (isolated release substitutes)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-install.py

      - name: Local gate runner contract (stub cargo, disposable repo)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-gates.py

      - name: Mutation exposure pre-push contract (stub cargo, disposable repo)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: sh scripts/test-mutants-preflight.sh

      - name: Release prepare contract (stub gh and cargo, disposable repo)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-prepare.py

      # release.yml writes the tap's formula and the Linux bottles with this
      # script: it is checked here, on every pull request, not first on a tag.
      - name: Homebrew formula and bottles contract (synthetic release archives)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-homebrew-formula.py

      # The homebrew-core formula release.yml attaches to every release;
      # homebrew-core.yml builds and audits it from source.
      - name: homebrew-core formula contract (build from source, no prebuilt binary)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-homebrew-core-formula.py

      - name: Release-prepare skip contract (disposable repo)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-release-prepare-only.py

      - name: Nightly mutants rotation and report contract
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-mutants-nightly.py

      - name: Mutation gate config contract (no module silently excluded)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-mutants-config.py

      - name: Retro lead-time contract (synthetic transcripts, no network)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 .agents/skills/pixel-retro/test_lead_time.py

      - name: Action pin check contract (tags, short SHAs, unparsed forms refused)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-verify-action-pins.py

      # clean.sh removes whole directories. The cases that matter are the ones
      # asserting what it leaves alone: a file git tracks, a tree behind a
      # symlink, the index under `just clean`, the daemon sockets beside the
      # shard cache.
      - name: Clean contract (disposable repo with a second worktree)
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: python3 scripts/test-clean.py

      - name: Install Bun
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Pi extension policy and event contracts
        if: ${{ needs.changes.outputs.scripts == 'true' }}
        run: bun scripts/test-pi-policy.mjs

  # Clippy and the reduced feature lanes, beside the Test job instead of
  # after it: they read no test result and took 35 s of its critical path
  # (clippy 17.6 s, the two `cargo check` lanes 8.7 s and 8.1 s, main run
  # 36584496012). Their check-only artifacts (rmeta, no codegen) live under
  # a key of their own, so the linux-debug entry the Test job and every
  # Mutants shard restore holds only what those build.
  lint:
    name: Lint (Clippy + feature lanes)
    needs: [scope, changes]
    if: needs.scope.outputs.release-prepare != 'true' && needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        # Vendored OpenSSL needs perl and make. The GitHub Ubuntu images ship
        # both ("already the newest version" in every log), so the ~7 s of
        # apt-get update runs only on an image that lacks one of them.
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      - name: Warnings-denied Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Supported CLI feature lanes
        run: |
          cargo check -p pixel-cli --no-default-features
          cargo check -p pixel-cli --no-default-features --features model2vec

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    needs: [scope, changes]
    if: needs.scope.outputs.release-prepare != 'true' && needs.changes.outputs.cargo == 'true'
    # Compiles Rust, so it follows the test job's self-hosted switch (pull
    # requests stay on GitHub's image, as there).
    runs-on: ${{ github.event_name != 'pull_request' && vars.PIXEL_RUNNER_LABELS && fromJSON(vars.PIXEL_RUNNER_LABELS) || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      # The toolchain here must equal `rust-version` in the root Cargo.toml:
      # cargo only enforces that field on dependency resolution, never on
      # the workspace's own code, so without this job the number drifts
      # (it read 1.85 while the tree needed 1.91). Bump both together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.91
        with:
          toolchain: "1.91"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        # Vendored OpenSSL needs perl and make. The GitHub Ubuntu images ship
        # both ("already the newest version" in every log), so the ~7 s of
        # apt-get update runs only on an image that lacks one of them.
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      - name: Toolchain matches Cargo.toml
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$declared" = "1.91" || { echo "Cargo.toml says rust-version $declared, this job installs 1.91"; exit 1; }

      # A check, not clippy: lint names are added by newer toolchains and
      # the lint gate runs on stable in the Lint job.
      - name: cargo check on the minimum toolchain
        run: cargo check --workspace --all-targets --locked

  # The ranking gate, beside the Test job instead of inside it: `cargo bench`
  # builds the `bench` profile (release's thin LTO and one codegen unit),
  # which shares no artifact with the debug build, and that compile alone
  # took 79 s of the Test job's ~290 s on main (run 36584496012; the five
  # NDCG lanes then ran in 15 s). The bench stays optimized: semantic_ask
  # embeds every query, which a debug build would slow down more than it
  # saves. A cache key of its own keeps the bench-profile artifacts out of
  # the linux-debug entry that the Test job and every Mutants shard restore.
  ranking:
    name: Ranking gates (NDCG@10)
    needs: [scope, changes]
    if: needs.scope.outputs.release-prepare != 'true' && needs.changes.outputs.cargo == 'true'
    # Compiles Rust, so it follows the test job's self-hosted switch (pull
    # requests stay on GitHub's image, as there).
    runs-on: ${{ github.event_name != 'pull_request' && vars.PIXEL_RUNNER_LABELS && fromJSON(vars.PIXEL_RUNNER_LABELS) || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        # Vendored OpenSSL needs perl and make. The GitHub Ubuntu images ship
        # both ("already the newest version" in every log), so the ~7 s of
        # apt-get update runs only on an image that lacks one of them.
        run: |
          if command -v perl >/dev/null && command -v make >/dev/null; then
            echo "perl and make already installed"
          else
            sudo apt-get update
            sudo apt-get install -y perl make
          fi

      # `[[bench]]` targets are `harness = false`: criterion owns `main`, so
      # nextest never runs them and the ranking assertions inside would gate
      # nothing. `-- --test` runs the bench bodies once, without criterion's
      # statistical sampling. Only the NDCG bench is gated here: m1_latency's
      # `search_service_time` assertion is red today (median 78.6ms in the
      # bench profile, 65.1ms in debug, against the M1 <1ms budget, while
      # `ping_service_time` passes), so the step would fail on every pull
      # request -- search latency is a perf fix of its own, not a CI-hygiene
      # one.
      - name: Ranking gates (NDCG@10, bench test mode)
        run: cargo bench -p pixel-bench --bench ndcg_relevance --locked -- --test

  deny:
    name: Dependency policy (cargo-deny)
    needs: [scope, changes]
    if: needs.scope.outputs.release-prepare != 'true' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      # cargo-deny resolves the graph through `cargo metadata`; no build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Prebuilt binary, same pinned installer as nextest above and cross in
      # cross-build.yml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-deny

      # Policy in deny.toml: RustSec advisories (vulnerable, yanked and
      # unmaintained crates), an allow-list of permissive licences, no two
      # majors of one crate outside the two embedding stacks, crates.io as
      # the only source. Every exception is documented in the file. The
      # advisory database is fetched by cargo-deny itself.
      - name: cargo deny check
        run: cargo deny check
