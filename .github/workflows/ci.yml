name: CI

on:
  push:
    # main is the only long-lived branch: every pull request merges into it
    # and every release is a tag on it.
    branches: [main]
  pull_request:
    # A pull request that only touches documentation no test reads -- prose
    # under docs/, the licence files, a Markdown file outside the list below
    # -- cannot change a test result, so it skips the two-and-a-half-minute
    # run. Later patterns win: the negations drop the docs first, then the
    # re-includes put back what the suite actually reads:
    #   - crates/**: the bundled agent prompts, checked by the install tests;
    #   - the files crates/pixel/tests/cli/docs_drift.rs reads: it asserts
    #     that every `pixel <command>` quoted there exists, that the README
    #     and CHANGELOG rename tables match RENAMED_COMMANDS row for row, and
    #     that the rule ids of the rust-guidelines skill head real guideline
    #     sections;
    #   - the generated plugin surfaces, which install_tests.rs compares
    #     against the prompts (scripts/gen-plugin-assets.sh --check).
    # Add a path here when a test starts reading one. Pushes to main stay
    # unfiltered so every merge there keeps a complete run. No branch
    # rule requires this check today; if one is added, the excluded paths
    # need a twin workflow that reports success.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!NOTICE"
      - "crates/**"
      # docs_drift.rs:
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "docs/manual-setup.md"
      - ".agents/rules/**"
      - ".agents/skills/rust-guidelines/**"
      - "scripts/README.md"
      - "js/sniper/README.md"
      # gen-plugin-assets.sh --check:
      - "PIXEL.md"
      - "PIXEL-SUBAGENT.md"
      - "skills/**"
      - ".openclaw/**"
      - ".clinerules/**"
      - ".kiro/**"
      - ".qoder/**"
      - ".windsurf/**"

# A new push to a pull request cancels the run still in flight for its
# previous commit. Pushes to main are never cancelled so every
# merge keeps a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the checkout; it never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One key for every job that builds the debug profile on Linux
          # (this one and mutants.yml), instead of the default per-job key.
          # The Mutants workflow only runs on pull_request, so it can never
          # save under the main rule below: without a shared key it
          # started from an empty cache on every PR.
          shared-key: linux-debug
          # PRs read the cache but never write it: only merges into main
          # refresh the shared entries, so one PR cannot thrash
          # or poison them. A failed build still saves what it compiled.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Prebuilt binary; the profile lives in .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-nextest

      # --locked: fail if Cargo.lock is out of date instead of silently
      # resolving newer dependency versions than the ones committed.
      # nextest runs one process per test, retries once and still fails the
      # run on a flaky result, and kills a test that hangs past 3 minutes.
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --locked --doc

      # `[[bench]]` targets are `harness = false`: criterion owns `main`, so
      # nextest never runs them and the ranking assertions inside would gate
      # nothing. `-- --test` runs the bench bodies once, without criterion's
      # statistical sampling. Only the NDCG bench is gated here: m1_latency's
      # `search_service_time` assertion is red today (median 78.6ms in the
      # bench profile, 65.1ms in debug, against the M1 <1ms budget, while
      # `ping_service_time` passes), so the step would fail on every pull
      # request -- search latency is a perf fix of its own, not a CI-hygiene
      # one.
      - name: Ranking gates (NDCG@10, bench test mode)
        run: cargo bench -p pixel-bench --bench ndcg_relevance --locked -- --test

      - name: Installer contracts (isolated release substitutes)
        run: python3 scripts/test-install.py

      - name: Local gate runner contract (stub cargo, disposable repo)
        run: python3 scripts/test-gates.py

      - name: Release prepare contract (stub gh and cargo, disposable repo)
        run: python3 scripts/test-prepare.py

      - name: Warnings-denied Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Supported CLI feature lanes
        run: |
          cargo check -p pixel-cli --no-default-features
          cargo check -p pixel-cli --no-default-features --features model2vec

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install TypeScript integration dependencies
        working-directory: js/sniper
        run: bun install --frozen-lockfile

      # The test helper builds and identifies this checkout's native binary
      # before sending real Vite and golden-envelope payloads across the CLI.
      - name: TypeScript integration and types
        working-directory: js/sniper
        run: |
          bun run test
          bun run typecheck

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      # The toolchain here must equal `rust-version` in the root Cargo.toml:
      # cargo only enforces that field on dependency resolution, never on
      # the workspace's own code, so without this job the number drifts
      # (it read 1.85 while the tree needed 1.91). Bump both together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.91
        with:
          toolchain: "1.91"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Toolchain matches Cargo.toml
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$declared" = "1.91" || { echo "Cargo.toml says rust-version $declared, this job installs 1.91"; exit 1; }

      # A check, not clippy: lint names are added by newer toolchains and
      # the lint gate runs on stable in the Test job.
      - name: cargo check on the minimum toolchain
        run: cargo check --workspace --all-targets --locked

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      # cargo-deny resolves the graph through `cargo metadata`; no build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Prebuilt binary, same pinned installer as nextest above and cross in
      # cross-build.yml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-deny

      # Policy in deny.toml: RustSec advisories (vulnerable, yanked and
      # unmaintained crates), an allow-list of permissive licences, no two
      # majors of one crate outside the two embedding stacks, crates.io as
      # the only source. Every exception is documented in the file. The
      # advisory database is fetched by cargo-deny itself.
      - name: cargo deny check
        run: cargo deny check
