name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run still in flight for the
# previous commit; runs on main are never cancelled so every merge is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      - name: Installer contracts (isolated release substitutes)
        run: python3 scripts/test-install.py

      - name: Warnings-denied Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Supported CLI feature lanes
        run: |
          cargo check -p pixel-cli --no-default-features
          cargo check -p pixel-cli --no-default-features --features model2vec

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install TypeScript integration dependencies
        working-directory: js/sniper
        run: bun install --frozen-lockfile

      # The test helper builds and identifies this checkout's native binary
      # before sending real Vite and golden-envelope payloads across the CLI.
      - name: TypeScript integration and types
        working-directory: js/sniper
        run: |
          bun run test
          bun run typecheck

  cross-build:
    name: Cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools perl make

      - name: Install cross
        run: cargo install cross

      # Must match release.yml exactly: fastembed (ONNX) has no musl build,
      # but model2vec is pure Rust and ships in the Linux release. Building
      # without it here would leave the released feature set untested.
      - name: Cross-build (model2vec only — ort-sys has no musl prebuilts)
        run: cross build --release --no-default-features --features model2vec --target ${{ matrix.target }} -p pixel-cli
