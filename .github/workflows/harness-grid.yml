name: harness-grid

# Generate the four harness videos (Claude Code, Codex, pi, Antigravity)
# with scripts/harness-sandbox-shoot.sh and publish the 2x2 grid to a pull
# request. The sandbox today is the OrbStack VM `pixel`, whose CLIs carry
# the logins and whose recording tools the pipeline installs itself — so
# the job targets the runner where those live: your machine, registered as
# a self-hosted GitHub Actions runner. On a GitHub-hosted runner it would
# refuse (no OrbStack) and fail loudly rather than half-run.
#
#   gh workflow run harness-grid -f pr=415
#   # optional: prompt="Create the \"story\" feature" (default)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to publish the grid on
        required: true
      prompt:
        description: The natural prompt every harness runs (no tool hints)
        required: false
        default: 'Create the "story" feature'

permissions:
  contents: write
  pull-requests: write

jobs:
  grid:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1 # v7
        with:
          fetch-depth: 0
      - name: Shoot the four harnesses and publish the grid
        env:
          HARNESS_INTERACTIVE_MAX: "300"
        run: |
          scripts/harness-sandbox-shoot.sh "${{ inputs.pr }}" "${{ inputs.prompt }}"
      - name: Post the run summary
        if: always()
        run: |
          echo "## Sandbox grid run" >> "$GITHUB_STEP_SUMMARY"
          for p in claude codex pi agy; do
            meta="/Users/livio/Downloads/shoot4/meta-$p-rns.json"
            [ -s "$meta" ] || continue
            python3 -c "
          import json
          m = json.load(open('$meta'))
          print(f\"- **$p**: {m['pixel_calls']} pixel calls in {round(m['wall_ms']/1000)}s\")" >> "$GITHUB_STEP_SUMMARY"
          done
