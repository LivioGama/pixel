name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools perl make

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p pixel-cli

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="pixel-${VERSION}-${TARGET}.tar.gz"
          STAGING="pixel-${VERSION}-${TARGET}"
          mkdir -p "$STAGING/bin"
          cp "target/${TARGET}/release/pixel" "$STAGING/bin/"
          cp README.md "$STAGING/" 2>/dev/null || true
          cp LICENSE "$STAGING/" 2>/dev/null || true
          tar czf "$ARCHIVE" "$STAGING"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat "$ARCHIVE.sha256" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pixel-*.tar.gz
            pixel-*.tar.gz.sha256
