name: Release

on:
  push:
    tags:
      - 'v*'

# Build jobs only need to read the checkout. Write access is granted to
# the release job alone (see below), which creates the GitHub release.
permissions:
  contents: read

jobs:
  # Gate: nothing is built or published unless the tag names the version that
  # Cargo.toml declares and the test suite passes on the tagged commit. CI does
  # not run on tag pushes, so this is the only check a release goes through.
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      # Tag = crates/pixel version, Cargo.lock fresh for every member,
      # CHANGELOG has the `## [x.y.z]` heading and an empty Unreleased.
      # A stale lock used to surface only in the build job, after the tests.
      # No --locked here on purpose: with it cargo would refuse before the
      # report names the stale member; the build job stays --locked.
      - name: Release consistency (pixel release-check)
        run: cargo run -q -p pixel-cli -- release-check "$GITHUB_REF" --repo .

      - name: Test
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          targets: ${{ matrix.target }}

      # Prebuilt binary instead of `cargo install cross`. cross compiles inside
      # its own Docker image (musl toolchain included), so no host packages.
      - name: Install cross (Linux musl)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cross

      # fastembed (ONNX) has no musl build; model2vec is pure Rust and does,
      # so the Linux binaries keep a working semantic channel.
      - name: Build (Linux musl via cross, model2vec only)
        if: runner.os == 'Linux'
        run: cross build --release --locked --no-default-features --features model2vec --target ${{ matrix.target }} -p pixel-cli

      - name: Build (macOS native)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }} -p pixel-cli

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="pixel-${VERSION}-${TARGET}.tar.gz"
          STAGING="pixel-${VERSION}-${TARGET}"
          mkdir -p "$STAGING/bin"
          cp "target/${TARGET}/release/pixel" "$STAGING/bin/"
          cp README.md LICENSE "$STAGING/"
          tar czf "$ARCHIVE" "$STAGING"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixel-${{ matrix.target }}
          path: |
            pixel-*.tar.gz
            pixel-*.tar.gz.sha256

  release:
    name: Publish release + formula
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Fine-grained PAT with Contents: read/write on LivioGama/homebrew-tap.
      # When unset, the formula is still attached to the release but the tap
      # is not updated (a warning is emitted instead of failing the release).
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Homebrew formula with real hashes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # Extract SHA256 for each target from the downloaded .sha256 files.
          ARM_MAC=$(awk '{print $1}' "artifacts/pixel-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")
          ARM_LINUX=$(awk '{print $1}' "artifacts/pixel-${VERSION}-aarch64-unknown-linux-musl.tar.gz.sha256")
          INTEL_LINUX=$(awk '{print $1}' "artifacts/pixel-${VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256")

          # No explicit `version`: Homebrew reads it from the archive name
          # (pixel-vX.Y.Z-<target>.tar.gz) and `brew audit` flags an explicit
          # one as redundant. This matches Formula/pixel.rb in the tap.
          cat > pixel.rb <<EOF
          class Pixel < Formula
            desc "Local control layer for coding agents — deterministic retrieval + git engine"
            homepage "https://github.com/LivioGama/pixel"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/LivioGama/pixel/releases/download/${VERSION}/pixel-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_MAC}"
              end
              # Intel Macs (pre-2020): no prebuilt binary. Build from source via:
              #   cargo build --release -p pixel-cli
            end

            on_linux do
              on_arm do
                url "https://github.com/LivioGama/pixel/releases/download/${VERSION}/pixel-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${ARM_LINUX}"
              end
              on_intel do
                url "https://github.com/LivioGama/pixel/releases/download/${VERSION}/pixel-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${INTEL_LINUX}"
              end
            end

            def install
              bin.install "bin/pixel"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/pixel --version")
            end
          end
          EOF

      # The release body is the tag's section of CHANGELOG.md (Keep a
      # Changelog: from "## [X.Y.Z]" to the next "## " heading).
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1 }
            inside && index($0, "## [" v "]") != 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no '## [${VERSION}]' section in CHANGELOG.md; the release body falls back to a link"
            echo "See [CHANGELOG.md](https://github.com/LivioGama/pixel/blob/v${VERSION}/CHANGELOG.md)." > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes.md
          files: |
            artifacts/pixel-*.tar.gz
            artifacts/pixel-*.tar.gz.sha256
            pixel.rb

      - name: Check out the Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: LivioGama/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish formula to the tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cp pixel.rb homebrew-tap/Formula/pixel.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pixel.rb
          if git diff --staged --quiet; then
            echo "Formula/pixel.rb already up to date for ${VERSION}"
            exit 0
          fi
          git commit -m "pixel ${VERSION#v}"
          git push

      - name: Tap not updated (no token)
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; update Formula/pixel.rb in LivioGama/homebrew-tap by hand from the pixel.rb release asset."

  # Post-publish smoke test: installs what was just published, the ways the
  # README installs it, on each target's own runner, and checks it is the
  # tagged build. `pixel --version` must print `pixel x.y.z` and `commit:
  # <the tag's commit>` (build.rs embeds it, `-dirty` included) from an empty
  # HOME. Nothing before this job ran the aarch64-apple-darwin binary, and
  # nothing ran install.sh or the tap formula at all. A failure here comes
  # after publication: it cannot unpublish, it says the next patch is due.
  smoke:
    name: Smoke ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false

      - name: Write the version check
        run: |
          cat > "$RUNNER_TEMP/check-version.sh" <<'EOF'
          #!/bin/sh
          # check-version.sh <pixel binary> <how it was installed>
          set -eu
          home="$(mktemp -d)"
          out="$(HOME="$home" "$1" --version)"
          printf '%s\n%s\n' "--- $2: $1 --version" "$out"
          if ! printf '%s\n' "$out" | grep -Fqx "pixel ${GITHUB_REF_NAME#v}"; then
            echo "::error::$2: $1 is not pixel ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -Fqx "commit: ${GITHUB_SHA}"; then
            echo "::error::$2: $1 was not built from ${GITHUB_SHA} (the ${GITHUB_REF_NAME} commit)"
            exit 1
          fi
          EOF
          chmod +x "$RUNNER_TEMP/check-version.sh"

      - name: Release asset (download, checksum, run)
        run: |
          ARCHIVE="pixel-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          DIR="$RUNNER_TEMP/asset"
          mkdir -p "$DIR" && cd "$DIR"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          shasum -a 256 -c "$ARCHIVE.sha256"
          tar xzf "$ARCHIVE"
          "$RUNNER_TEMP/check-version.sh" "$DIR/pixel-${GITHUB_REF_NAME}-${{ matrix.target }}/bin/pixel" "release asset"

      # The script from the tag, which is what main serves once the release
      # PR merges. It resolves releases/latest, so it is only checked when
      # this tag is the latest release (a hotfix on an older line is not).
      - name: scripts/install.sh
        run: |
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$LATEST" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::latest release is $LATEST, not $GITHUB_REF_NAME; install.sh not checked"
            exit 0
          fi
          PIXEL_INSTALL_DIR="$RUNNER_TEMP/install-sh" sh scripts/install.sh
          "$RUNNER_TEMP/check-version.sh" "$RUNNER_TEMP/install-sh/pixel" "install.sh"

      # Formula-wise the three targets are the same file; macOS is the one
      # target with no other install path than the tap for most users.
      - name: Homebrew tap
        if: runner.os == 'macOS' && env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap LivioGama/tap
          brew install LivioGama/tap/pixel
          brew test LivioGama/tap/pixel
          "$RUNNER_TEMP/check-version.sh" "$(brew --prefix)/bin/pixel" "brew install LivioGama/tap/pixel"
