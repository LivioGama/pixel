name: Mutants

# Mutation testing on the code a pull request touches. cargo-mutants rewrites
# each changed function (return a default, flip an operator, drop a match
# guard) and requires the crate's tests to fail. A mutant that survives means
# the change is not covered by a test that can fail, which is a gate in
# CONTRIBUTING.md ("Mutation testing"). Full-tree runs are a local,
# per-crate activity; CI only pays for the diff.
on:
  pull_request:
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
      - "Cargo.*"
      - "crates/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  in-diff:
    name: Mutants in diff
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history so the merge base with the target branch is available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PRs read the cache but never write it: only develop/main
          # merges refresh the shared entries, so one PR cannot thrash
          # or poison them. A failed build still saves what it compiled.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      - name: Install cargo-mutants
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-mutants

      # Three-dot diff: what this branch changed since it left the target
      # branch, so mutants are generated only in code the PR authored.
      - name: Diff against the target branch
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      # --in-place: mutate the checkout itself instead of copying it (CI
      # discards the tree). Exit codes: 0 all caught, 2 missed, 3 timeout,
      # 4 baseline tests already failing. Missed and timeouts fail the job;
      # GitHub annotations point at each surviving mutant.
      - name: Run mutants in the diff
        run: cargo mutants -vV -C --locked --in-place --in-diff pr.diff

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
