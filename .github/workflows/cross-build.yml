name: Cross-build

# The release lanes, built exactly as release.yml builds them: musl through
# cross (--locked, model2vec only) and aarch64-apple-darwin natively. The Test job's `cargo check` of that feature
# set runs on glibc and cannot see a dependency that fails to link against
# musl or a Cargo.lock that --locked rejects, so this is the only job that
# proves a change still ships. It runs on every push to main and on the
# pull requests that can change the outcome; a docs, prompt or script PR
# skips it. The release workflow's build job builds the same lane again
# from the tag. No branch rule requires this check today; if one is added,
# the excluded paths need a twin workflow that reports success.
#
# A release-prepare pull request into main (`release-x.y.z` branch whose
# diff the `scope` job verifies, see ci.yml) skips the job: its diff is version bumps, Cargo.lock and the changelog, and the
# release skill tags only once the push run on the merge commit is green,
# so the pull request run would build the same tree twice. A maintenance
# release into `release/x.y` keeps it: no push run covers that branch.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/cross-build.yml"
      - "Cargo.*"
      - "crates/**"
      - "deny.toml"
      - "rust-toolchain*"

# A new push to a pull request cancels the run still in flight for its
# previous commit. A push to main gets a group of its own commit, so a merge
# neither waits behind the previous merge's run nor cancels a pending one
# (see ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the checkout; it never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release-prepare pull request? See release-prepare-scope.yml.
  scope:
    uses: ./.github/workflows/release-prepare-scope.yml

  cross-build:
    name: Cross-build ${{ matrix.target }}
    needs: scope
    if: needs.scope.outputs.release-prepare != 'true'
    runs-on: ${{ matrix.os }}
    # A pull request into main builds `dev-release` (release without thin LTO
    # and with 16 codegen units): the lane still has to link against musl
    # with the release feature set and a --locked Cargo.lock, which is what
    # this job exists to prove, but the 16 workspace crates no longer go
    # through LTO. On PR runs every dependency already came from the cache
    # and those crates were the whole build: 2 min 21 s to 3 min 53 s in
    # `release` (runs 36576912510, 36579443968). The push to main keeps
    # building `release` exactly as release.yml does, and the release skill
    # tags only once that run is green, so an LTO-only failure still stops a
    # release before its tag. A maintenance pull request into `release/x.y`
    # keeps `release`: no push run covers that branch.
    env:
      PROFILE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'dev-release' || 'release' }}
    strategy:
      fail-fast: true
      matrix:
        # The three release targets, on the runners release.yml builds them
        # on. aarch64-apple-darwin is here so a push to main proves the macOS
        # lane before a tag does, and saves the cache the tag's build restores.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # The SHA pin no longer names the toolchain through the ref, so
          # it is passed explicitly (same channel as before).
          toolchain: stable
          targets: ${{ matrix.target }}

      # One entry per target, shared with release.yml's build job: a shared
      # key replaces the job id in the cache key, so the tag's build (job
      # `build`) restores what this job (`cross-build`) saved on main. A tag
      # run can read the default branch's caches, never another tag's.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # PRs read the cache but never write it: only merges into main
          # refresh the shared entries, so one PR cannot thrash
          # or poison them. A failed build still saves what it compiled.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          shared-key: release-${{ matrix.target }}

      # Prebuilt binary instead of `cargo install cross` (~40 s per run).
      # cross compiles inside its own Docker image, which carries the musl
      # toolchain, so no host musl-tools/perl/make are needed.
      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cross

      # Must match release.yml exactly, but for the profile (see PROFILE
      # above): fastembed (ONNX) has no musl build, but model2vec is pure
      # Rust and ships in the Linux release. Building without it here would
      # leave the released feature set untested.
      - name: Cross-build (model2vec only — ort-sys has no musl prebuilts)
        if: runner.os == 'Linux'
        run: cross build --profile "$PROFILE" --locked --no-default-features --features model2vec --target ${{ matrix.target }} -p pixel-cli

      # Must match release.yml's macOS step exactly, but for the profile:
      # default features, native.
      - name: Build (macOS native)
        if: runner.os == 'macOS'
        run: cargo build --profile "$PROFILE" --locked --target ${{ matrix.target }} -p pixel-cli

      # The cache a pull request restores is the one main saves, and a
      # `dev-release` build finds no dependency in a `release`-only target
      # dir: it would compile all of them, slower than the LTO it skips. So
      # main also builds the pull requests' profile, with the very command
      # they run, before rust-cache saves both profiles under one key.
      - name: Warm the pull requests' dev-release cache
        if: github.event_name == 'push'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cross build --profile dev-release --locked --no-default-features --features model2vec --target ${{ matrix.target }} -p pixel-cli
          else
            cargo build --profile dev-release --locked --target ${{ matrix.target }} -p pixel-cli
          fi
