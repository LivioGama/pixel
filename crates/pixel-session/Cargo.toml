[package]
name = "pixel-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.1.4", features = ["transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
rmcp = { version = "3.1.4", features = ["transport-io"] }
