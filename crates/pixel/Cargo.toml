[package]
name = "pixel-cli"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "pixel"
path = "src/main.rs"

[features]
default = ["fastembed", "model2vec"]
# ONNX-backed embeddings. Cannot build for *-unknown-linux-musl: ort-sys
# downloads a prebuilt ONNX Runtime and upstream publishes no musl build.
fastembed = ["pixel-recall/fastembed"]
# Pure-Rust embeddings. No ONNX, no OpenSSL, no C++ — builds fine for musl,
# so the Linux release keeps a working semantic channel without fastembed.
model2vec = ["pixel-recall/model2vec"]

[dependencies]
mutants = { workspace = true }
pixel-index = { path = "../pixel-index" }
pixel-git = { path = "../pixel-git" }
pixel-recall = { path = "../pixel-recall", default-features = false }
pixel-daemon = { path = "../pixel-daemon" }
pixel-graph = { path = "../pixel-graph" }
pixel-rank = { path = "../pixel-rank" }
pixel-session = { path = "../pixel-session" }
pixel-ops = { path = "../pixel-ops" }
pixel-facts = { path = "../pixel-facts" }
pixel-install = { path = "../pixel-install" }
pixel-proto = { path = "../pixel-proto" }
pixel-actionlog = { path = "../pixel-actionlog" }
pixel-flow = { path = "../pixel-flow" }
pixel-release = { path = "../pixel-release" }
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"
regex = "1.13"
globset = "0.4"
ignore = "0.4.33"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["json", "rustls-webpki-roots"] }
tar = "0.4"
xxhash-rust = { workspace = true }
rmcp = { version = "3.1.4", features = ["transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# Reads website/data/agents.toml in tests/cli/docs_drift.rs; already in the
# tree through pixel-install.
toml_edit = "0.25.15"
