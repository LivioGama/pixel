[package]
name = "pixel-recall"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["fastembed", "model2vec"]
fastembed = ["dep:fastembed", "dep:openssl"]
model2vec = ["dep:model2vec-rs"]

[dependencies]
fastembed = { version = "6", optional = true }
pixel-index = { path = "../pixel-index" }
pixel-rank = { path = "../pixel-rank" }
memmap2 = "0.9.11"
model2vec-rs = { version = "0.2", optional = true }
# Vendored openssl needed by fastembed → hf-hub → native-tls → openssl.
# Optional: only compiled when fastembed is enabled, so musl builds
# (--no-default-features) don't need OpenSSL at all.
openssl = { workspace = true, optional = true }
regex = "1.13"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
xxhash-rust = { workspace = true }

[dev-dependencies]
tempfile = "3"
