<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Review what changed before editing</title><rect width="1440" height="900" fill="#0d1117"/><text x="720" y="72" fill="#f0f6fc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle">Review what changed before editing</text><text x="400" y="112" fill="#8b949e" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400">Same repository question, shown as terminal work instead of an abstract diagram.</text><rect x="42" y="150" width="656" height="642" rx="28" fill="#151a21" stroke="#30363d" stroke-width="2"/><rect x="742" y="150" width="656" height="642" rx="28" fill="#12172b" stroke="#35477e" stroke-width="2"/><text x="370" y="208" fill="#aab4c3" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">Cold agent</text><text x="1070" y="208" fill="#b9c4ff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">Pixel-guided agent</text><text x="78" y="257" fill="#8b949e" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="500">prompt: “what is already different in this branch?”</text><text x="778" y="257" fill="#a8b4eb" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="500">prompt: “what is already different in this branch?”</text><rect x="78" y="292" width="584" height="270" rx="18" fill="#171b22" stroke="#30363d" stroke-width="2"/><circle cx="108" cy="322" r="7" fill="#ff6b6b"/><circle cx="132" cy="322" r="7" fill="#f2c94c"/><circle cx="156" cy="322" r="7" fill="#55d98a"/><text x="186" y="330" fill="#aab4c3" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">terminal</text><text x="106" y="375" fill="#e6edf3" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">$ git status</text><text x="106" y="418" fill="#8b949e" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">$ git diff</text><text x="106" y="461" fill="#8b949e" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">$ rg &quot;format_metrics_line&quot; .</text><text x="106" y="504" fill="#8b949e" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">… relate the diff to callers by hand</text><rect x="778" y="292" width="584" height="270" rx="18" fill="#171c35" stroke="#35477e" stroke-width="2"/><circle cx="108" cy="322" r="7" fill="#ff6b6b"/><circle cx="132" cy="322" r="7" fill="#f2c94c"/><circle cx="156" cy="322" r="7" fill="#55d98a"/><text x="886" y="330" fill="#aab4c3" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">pixel</text><text x="806" y="375" fill="#e6edf3" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">$ pixel changes .</text><text x="806" y="418" fill="#aab7ff" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">changed_files: 13</text><text x="806" y="461" fill="#aab7ff" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">format_metrics_line  modified</text><text x="806" y="504" fill="#65d49d" font-family="SFMono-Regular,Menlo,monospace" font-size="19" font-weight="500">risk: LOW  ·  call sites resolved</text><rect x="78" y="638" width="584" height="112" rx="16" fill="#1b2028" stroke="#30363d" stroke-width="2"/><rect x="778" y="638" width="584" height="112" rx="16" fill="#1a2040" stroke="#35477e" stroke-width="2"/><text x="106" y="685" fill="#9aa5b1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500">Manual sequence: discover → open → trace → interpret</text><text x="806" y="685" fill="#bec8ff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600">Working-tree change plus blast-radius context together</text><text x="720" y="850" fill="#6e7681" font-family="Inter,Arial,sans-serif" font-size="17" text-anchor="middle">Illustrative presentation; command names and result excerpts come from Pixel’s local CLI output.</text></svg>